# Railway — deploy from monorepo root (no Root Directory click required).
# Auto-deploys on every push to the connected GitHub branch (main).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
